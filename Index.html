    const WHO_PICKER_EXCLUDE = new Set([
      'lunch pt 1','lunch pt 2','lunch 1','lunch 2','break','reg','registration'
    ]);

    // Subjects excluded from "Who is teaching?" results. These are
    // whole-staff collaborative or administrative blocks that appear as
    // lessons in the XML but don't represent a teacher delivering a class.
    const WHO_SUBJECT_EXCLUDE = new Set([
      'collaboration time', 'collab time (hrm)'
    ]);
    function isExcludedFromPicker(label) {
      return WHO_PICKER_EXCLUDE.has((label || '').toLowerCase());
    }

    /**
     * Extracts the first number in the 6–12 range from an MSSS class short
     * code, regardless of letter prefix.  Handles formats like "6A", "09G",
     * "G6A", "MS6B", "Y10A".  Returns null when no valid grade is found.
     * The 6–12 filter also prevents group-number digits (e.g. "1" in "TG1")
     * from being mistaken for a grade.
     */
    function parseGradeNum(className) {
      const nums = [...className.matchAll(/\d+/g)].map(m => parseInt(m[0], 10));
      return nums.find(n => n >= 6 && n <= 12) ?? null;
    }

    /**
     * Given an MSSS block's classNames string (comma-separated class codes),
     * returns 'MS' (grades 6–8) or 'SS' (grades 9–12) based on the lowest
     * grade number found.  Defaults to 'SS' when no numeric grade is parsed.
     */
    function gradeToSection(classNames) {
      const grades = classNames.split(',')
        .map(s => parseGradeNum(s))
        .filter(g => g !== null);
      if (!grades.length) return 'SS';
      return Math.min(...grades) <= 8 ? 'MS' : 'SS';
    }

    /**
     * Returns the lowest valid MSSS grade from a classNames string, or null.
     * Used to group lessons by grade within the results table.
     */
    function gradeOfLesson(classNames) {
      const grades = classNames.split(',')
        .map(s => parseGradeNum(s))
        .filter(g => g !== null);
      return grades.length ? Math.min(...grades) : null;
    }

    /**
     * Builds a flat allLessons array from loaded teacherData.  Each entry
     * carries enough context for the "Who is teaching?" renderer to filter and
     * display without touching the raw schedules again.
     */
    function buildAllLessons(data) {
      const lessons = [];
      data.teachers.forEach(teacher => {
        const sched = data.schedules[teacher.scheduleKey];
        if (!sched) return;
        ['S1', 'S2'].forEach(sem => {
          // MSSS lessons — Week A and B stored separately.
          if (sched.msss) {
            ['A', 'B'].forEach(week => {
              [1, 2, 3, 4, 5].forEach(day => {
                (sched.msss[sem]?.[week]?.[day] || []).forEach(block => {
                  lessons.push({
                    teacher,
                    source: 'msss',
                    section: gradeToSection(block.classNames),
                    sem, week, day,
                    subject:      block.subject,
                    subjectShort: block.subjectShort,
                    classNames:   block.classNames,
                    roomShort:    block.roomShort,
                    startMin:     block.startMin,
                    endMin:       block.endMin,
                  });
                });
              });
            });
          }
          // JS lessons — single week only.
          if (sched.js) {
            [1, 2, 3, 4, 5].forEach(day => {
              (sched.js[sem]?.['single']?.[day] || []).forEach(block => {
                lessons.push({
                  teacher,
                  source:  'js',
                  section: 'JS',
                  sem, week: 'single', day,
                  subject:      block.subject,
                  subjectShort: block.subjectShort,
                  classNames:   block.classNames,
                  roomShort:    block.roomShort,
                  startMin:     block.startMin,
                  endMin:       block.endMin,
                });
              });
            });
          }
        });
      });
      return lessons;
    }

    /** Returns the teaching periods for the currently-selected division, excluding breaks. */
    function getWhoPeriods() {
      if (!teacherData) return [];
      const src = whoTeachingDivision === 'JS'
        ? teacherData.jsPeriods
        : teacherData.msssPeriods;
      return (src || []).filter(p => !isExcludedFromPicker(p.label));
    }

    /**
     * Rebuilds the period-picker button row inside #who-period-toggle,
     * preserving the active state of whoTeachingPeriodIdx.
     */
    function buildWhoPeriodPicker() {
      const toggle = document.getElementById('who-period-toggle');
      if (!toggle) return;
      toggle.innerHTML = '';

      const nowBtn = document.createElement('button');
      nowBtn.id = 'btn-who-now';
      nowBtn.textContent = 'Now';
      nowBtn.onclick = () => setWhoPeriod(null);
      if (whoTeachingPeriodIdx === null) nowBtn.classList.add('active');
      toggle.appendChild(nowBtn);

      getWhoPeriods().forEach((period, i) => {
        const btn = document.createElement('button');
        btn.textContent = period.label;
        btn.onclick = () => setWhoPeriod(i);
        if (whoTeachingPeriodIdx === i) btn.classList.add('active');
        toggle.appendChild(btn);
      });
    }

    function setWhoDivision(div) {
      whoTeachingDivision  = div;
      whoTeachingPeriodIdx = null; // reset to Now when division changes
      ['JS','MS','SS'].forEach(d =>
        document.getElementById(`btn-who-${d.toLowerCase()}`)
          ?.classList.toggle('active', d === div)
      );
      buildWhoPeriodPicker();
      renderWhoIsTeaching();
    }

    function setWhoDay(col) {
      whoTeachingDayCol = col;
      const pairs = [[null,'today'],[1,'mon'],[2,'tue'],[3,'wed'],[4,'thu'],[5,'fri']];
      pairs.forEach(([v, suffix]) =>
        document.getElementById(`btn-who-${suffix}`)
          ?.classList.toggle('active', col === v)
      );
      renderWhoIsTeaching();
    }

    function setWhoPeriod(idx) {
      whoTeachingPeriodIdx = idx;
      buildWhoPeriodPicker(); // rebuilds with correct active state
      renderWhoIsTeaching();
    }

    /**
     * Renders the "Who is teaching?" view into #grids.
     * Filters allLessons by division, semester, day, week, and the selected
     * period; groups results by grade; shows a summary banner at the top.
     */
    function renderWhoIsTeaching() {
      const gridsEl = document.getElementById('grids');
      gridsEl.innerHTML = '';

      if (!teacherData || allLessons.length === 0) {
        gridsEl.innerHTML = '<p class="wit-placeholder">Loading teacher data…</p>';
        return;
      }

      const dayCol = whoTeachingDayCol === null ? getTodayCol() : whoTeachingDayCol;
      if (dayCol === null) {
        gridsEl.innerHTML = '<p class="wit-placeholder">No school today — select a weekday above to look ahead.</p>';
        return;
      }

      // Resolve selected period.
      const periods = getWhoPeriods();
      const nowMin  = getCurrentMin();
      let period;
      if (whoTeachingPeriodIdx === null) {
        // "Now" — find the period whose time range contains the current minute.
        period = periods.find(p => nowMin >= p.startMin && nowMin < p.endMin) || null;
      } else {
        period = periods[whoTeachingPeriodIdx] || null;
      }

      if (!period) {
        const msg = whoTeachingPeriodIdx === null
          ? 'No lesson in progress right now — select a period above to look ahead.'
          : 'Period data not available.';
        gridsEl.innerHTML = `<p class="wit-placeholder">${msg}</p>`;
        return;
      }

      const sem     = currentSem;
      const isJsDiv = whoTeachingDivision === 'JS';

      // If currentWeek is unknown and the division is MSSS, check both weeks
      // and de-duplicate — a lesson present in both A and B is shown once.
      const targetWeeks = isJsDiv
        ? ['single']
        : (currentWeek ? [currentWeek] : ['A', 'B']);

      let matching = allLessons.filter(l =>
        l.sem    === sem            &&
        targetWeeks.includes(l.week) &&
        l.day    === dayCol         &&
        l.startMin < period.endMin  &&
        l.endMin > period.startMin  &&
        l.section === whoTeachingDivision &&
        !WHO_SUBJECT_EXCLUDE.has((l.subject || '').toLowerCase())
      );

      // De-duplicate when both A and B weeks were searched.
      if (targetWeeks.length > 1) {
        const seen = new Set();
        matching = matching.filter(l => {
          const key = `${l.teacher.scheduleKey}|${l.startMin}|${l.classNames}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      const DAY_LABELS = ['Mon','Tue','Wed','Thu','Fri'];
      const dayLabel   = DAY_LABELS[dayCol - 1];
      const divLabel   = { JS: 'Junior School', MS: 'Middle School', SS: 'Senior School' }[whoTeachingDivision];

      // Summary banner.
      const banner = document.createElement('div');
      banner.className = 'wit-banner' + (matching.length === 0 ? ' wit-banner-empty' : '');

      if (matching.length === 0) {
        banner.innerHTML = `<strong>No sessions found</strong>
          <span class="wit-banner-detail">${divLabel} · ${period.label} · ${dayLabel}</span>`;
        gridsEl.appendChild(banner);
        return;
      }

      const weekNote = targetWeeks.length > 1
        ? ' · <em>week unknown — showing A &amp; B combined</em>'
        : '';
      banner.innerHTML = `
        <strong>${matching.length} session${matching.length !== 1 ? 's' : ''}</strong>
        <span class="wit-banner-detail">${divLabel} · ${period.label} · ${dayLabel}${weekNote}</span>`;
      gridsEl.appendChild(banner);

      // All divisions: single flat table sorted by class name.
      const sorted = [...matching].sort((a, b) => a.classNames.localeCompare(b.classNames));
      gridsEl.appendChild(buildWitTable(sorted));
    }

    // Tracks current sort state per table so click-toggling works.
    const witSortState = new WeakMap();

    /**
     * Builds a <table> for `lessons` with colour-coded left borders and
     * click-to-sort column headers.  Clicking a header sorts ascending;
     * clicking the same header again reverses the sort.
     */
    function buildWitTable(lessons) {
      const table = document.createElement('table');
      table.className = 'wit-table';

      const thead = table.createTHead();
      const hr = thead.insertRow();
      ['Teacher', 'Subject', 'Class', 'Room'].forEach((label, colIdx) => {
        const th = document.createElement('th');
        th.innerHTML = `${label} <span class="wit-sort-arrow">⇅</span>`;
        th.style.cursor = 'pointer';
        th.addEventListener('click', () => sortWitTable(table, colIdx));
        hr.appendChild(th);
      });

      const tbody = table.createTBody();
      lessons.forEach(l => {
        const tr = tbody.insertRow();
        tr.style.borderLeftColor = subjectColour(l.subjectShort);
        [l.teacher.name, l.subject, l.classNames, l.roomShort || '—'].forEach(text => {
          const td = tr.insertCell();
          td.textContent = text;
        });
      });

      return table;
    }

    /**
     * Sorts a .wit-table by the given column index.
     * Clicking the already-sorted column reverses the sort direction.
     */
    function sortWitTable(table, colIdx) {
      const state = witSortState.get(table) || { col: -1, asc: true };
      const asc   = state.col === colIdx ? !state.asc : true;
      witSortState.set(table, { col: colIdx, asc });

      const tbody = table.querySelector('tbody');
      const rows  = [...tbody.querySelectorAll('tr')];
      rows.sort((a, b) => {
        const at = a.cells[colIdx]?.textContent || '';
        const bt = b.cells[colIdx]?.textContent || '';
        return asc ? at.localeCompare(bt) : bt.localeCompare(at);
      });
      rows.forEach(r => tbody.appendChild(r));

      table.querySelectorAll('th').forEach((th, i) => {
        th.classList.toggle('wit-sorted', i === colIdx);
        const arrow = th.querySelector('.wit-sort-arrow');
        if (arrow) arrow.textContent = i === colIdx ? (asc ? '↑' : '↓') : '⇅';
      });
    }

    // ── View toggle ───────────────────────────────────────────────────────────
    function setView(view) {
      currentView = view;
      document.getElementById('btn-view-classes').classList.toggle('active',  view === 'classes');
      document.getElementById('btn-view-teachers').classList.toggle('active', view === 'teachers');
      document.getElementById('btn-view-subjects').classList.toggle('active', view === 'subjects');
      document.getElementById('btn-view-rooms').classList.toggle('active',    view === 'rooms');
      document.getElementById('btn-view-meeting').classList.toggle('active',  view === 'meeting');
      document.getElementById('btn-view-who').classList.toggle('active',      view === 'who');
      document.getElementById('class-controls').style.display   = view === 'classes'  ? 'contents' : 'none';
      document.getElementById('teacher-controls').style.display = view === 'teachers' ? 'contents' : 'none';
      document.getElementById('subject-controls').style.display = view === 'subjects' ? 'contents' : 'none';
      document.getElementById('room-controls').style.display    = view === 'rooms'    ? 'contents' : 'none';
      document.getElementById('meeting-controls').style.display = view === 'meeting'  ? 'contents' : 'none';
      document.getElementById('who-controls').style.display     = view === 'who'      ? 'contents' : 'none';
      // The subject-highlight legend only makes sense in Classes view, where
      // several subjects are visible at once — the other views already scope
      // to one selected entity.
      document.getElementById('legend').style.display = view === 'classes' ? '' : 'none';
      activeFilters.clear();

      if (view === 'teachers')      renderTeacherTimeline();
      else if (view === 'subjects') renderSubjectTimeline();
      else if (view === 'rooms')    renderRoomTimeline();
      else if (view === 'meeting')  renderMeetingFinder();
      else if (view === 'who')      { buildWhoPeriodPicker(); renderWhoIsTeaching(); }
      else                          renderGrid();
    }

    // ── Semester toggle ───────────────────────────────────────────────────────
    function setSemester(sem) {
      currentSem = sem;
      document.getElementById('btn-s1').classList.toggle('active', sem === 'S1');
      document.getElementById('btn-s2').classList.toggle('active', sem === 'S2');

      if (currentView === 'teachers')      renderTeacherTimeline();
      else if (currentView === 'subjects') renderSubjectTimeline();
      else if (currentView === 'rooms')    renderRoomTimeline();
      else if (currentView === 'meeting')  renderMeetingFinder();
      else if (currentView === 'who')      renderWhoIsTeaching();
      else                                 renderGrid();
    }

    // ── Filter ────────────────────────────────────────────────────────────────
    /**
     * Toggles one subject in the active filter set.
     * Multiple subjects can be active simultaneously — each click adds or removes one.
     */
    function toggleFilter(short) {
      if (activeFilters.has(short)) {
        activeFilters.delete(short);
      } else {
        activeFilters.add(short);
      }
      applyFilter();
    }

    function clearFilter() {
      activeFilters.clear();
      applyFilter();
    }

    /**
     * Applies the current filter set to the rendered DOM without re-rendering.
     * A slot matches if its subject is in activeFilters (or if no filter is active).
     */
    function applyFilter() {
      const gridsEl  = document.getElementById('grids');
      const legendEl = document.getElementById('legend');
      const clearBtn = document.getElementById('legend-clear');
      const hasFilter = activeFilters.size > 0;

      gridsEl.classList.toggle('filter-active', hasFilter);
      legendEl.classList.toggle('has-active', hasFilter);
      clearBtn.classList.toggle('visible', hasFilter);

      document.querySelectorAll('.slot').forEach(el => {
        el.classList.toggle('filter-match', activeFilters.has(el.dataset.subject));
      });
      document.querySelectorAll('.legend-item').forEach(el => {
        el.classList.toggle('active', activeFilters.has(el.dataset.subject));
      });
    }

    // ── Grid rendering ────────────────────────────────────────────────────────
    // Lowercased so isNonTeaching() can match regardless of how a given
    // period label happens to be capitalized in the source XML.
    const NON_TEACHING = new Set([
      'lunch pt 1','lunch pt 2','lunch 1','lunch 2','break','reg','registration'
    ]);
    function isNonTeaching(label) { return NON_TEACHING.has((label || '').toLowerCase()); }
    const DAYS = [1, 2, 3, 4, 5];

    function densityClass(count) {
      if (count >= 6) return 'density-ultra';
      if (count >= 4) return 'density-dense';
      if (count >= 3) return 'density-compact';
      return '';   // full detail for 1-2 splits
    }

    function renderGrid() {
      if (!currentTg || !timetableData) return;
      const semData = timetableData.grids[currentTg.id]?.[currentSem];
      const periods = timetableData.periods;
      const gridsEl = document.getElementById('grids');
      gridsEl.innerHTML = '';

      const usedSubjects = {};

      // weekKeys: ['A','B'] for MSSS, ['single'] for JS.
      const weekKeys  = timetableData.weeksMode === 'AB' ? ['A', 'B'] : ['single'];
      const dayLabels = timetableData.dayLabels || ['Mon','Tue','Wed','Thu','Fri'];

      weekKeys.forEach(week => {
        const weekData = semData?.[week];
        const block    = document.createElement('div');
        block.className = 'week-block';

        const titleEl = document.createElement('div');
        titleEl.className = 'week-title';
        titleEl.textContent = week === 'single' ? 'Schedule' : `Week ${week}`;
        block.appendChild(titleEl);

        const table = document.createElement('table');
        table.className = 'timetable';

        // colgroup
        const cg = document.createElement('colgroup');
        const cp = document.createElement('col');
        cp.className = 'col-period';
        cg.appendChild(cp);
        DAYS.forEach(() => { const cd = document.createElement('col'); cd.className = 'col-day'; cg.appendChild(cd); });
        table.appendChild(cg);

        // thead
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        const thCorner = document.createElement('th');
        thCorner.className = 'th-period';
        headRow.appendChild(thCorner);
        // Determine whether to show the now-indicator on this grid.
        // For MSSS (AB weeks): only on the grid whose week matches currentWeek.
        // For JS (single week): always show.
        const todayCol  = getTodayCol();
        const nowMin    = getCurrentMin();
        const showNow   = todayCol !== null &&
          (week === 'single' || week === currentWeek);

        DAYS.forEach((d, i) => {
          const th = document.createElement('th');
          th.textContent = dayLabels[i];
          if (showNow && d === todayCol) th.classList.add('current-day');
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        // tbody
        const tbody = document.createElement('tbody');
        periods.forEach(period => {
          const h  = rowHeight(period.durationMin);
          const tr = document.createElement('tr');
          if (isNonTeaching(period.label)) tr.classList.add('non-teaching');
          const periodIsNow = showNow &&
            !isNonTeaching(period.label) &&
            nowMin >= period.startMin && nowMin < period.endMin;
          if (periodIsNow) tr.classList.add('current-period');

          // Period label — height forces consistent row height across all cells
          const tdLabel = document.createElement('td');
          tdLabel.className  = 'period-label';
          tdLabel.style.height = h + 'px';
          tdLabel.innerHTML = `
            <div class="period-name">${period.label}</div>
            <div class="period-time">${formatTime(period.startMin)}–${formatTime(period.endMin)}</div>
          `;
          tr.appendChild(tdLabel);

          DAYS.forEach(day => {
            const slots = weekData?.[day]?.[period.period] || [];
            const td    = document.createElement('td');
            const isDayNow = showNow && day === todayCol;
            td.className = 'grid-cell' + (slots.length === 0 ? ' empty' : '') + (isDayNow ? ' current-day' : '');

            /*
             * cell-frame: fixed height + overflow:hidden.
             * This is what actually enforces consistent row heights — the <td>
             * expands to match the frame, and content that won't fit is clipped.
             */
            const frame = document.createElement('div');
            frame.className  = 'cell-frame';
            frame.style.height = h + 'px';

            if (slots.length > 0) {
              const slotRow = document.createElement('div');
              slotRow.className = 'slot-row ' + densityClass(slots.length);

              slots.forEach(slot => {
                usedSubjects[slot.subjectShort] = slot.subject;
                const div = document.createElement('div');
                div.className       = 'slot';
                div.dataset.subject = slot.subjectShort;
                div.style.background = subjectColour(slot.subjectShort);

                // Sub-group labels are only meaningful when the cell is split —
                // in a single-slot cell the whole group is together, so showing
                // group names (e.g. "1-1, 1-2, 1-3") adds noise not information.
                const sgHtml = (slots.length > 1 && slot.subGroupNames.length > 0)
                  ? `<div class="slot-subgroups">${slot.subGroupNames.join('<br>')}</div>`
                  : '';

                // Priority order subject > teacher > room > sub-groups — with
                // travelling groups now well-established, sub-group codes are
                // the least essential thing here and the first to fade.
                //
                // Advisory periods are brief (short row height) regardless of
                // split count, so stacking teacher under room wastes height
                // that a wide, lightly-split cell has plenty of. Advisory
                // teacher+room go in a flex-wrap row instead: side-by-side
                // when there's width to spare, falling back to stacked once
                // the cell gets too narrow — no split-count threshold needed,
                // the wrap happens purely from the two items not fitting.
                const teacherRoomHtml = slot.subjectShort.toLowerCase() === 'adv'
                  ? `<div class="slot-advisory-row">
                       <div class="slot-teacher">${slot.teacher}</div>
                       <div class="slot-room">${slot.roomShort}</div>
                     </div>`
                  : `<div class="slot-teacher">${slot.teacher}</div>
                     <div class="slot-room">${slot.roomShort}</div>`;

                div.innerHTML = `
                  <div class="slot-subject" data-short="${slot.subjectShort}">${slot.subject}</div>
                  ${teacherRoomHtml}
                  ${sgHtml}
                `;
                div.title = [
                  slot.subject, slot.teacher, slot.room,
                  slot.subGroupNames.length ? `Groups: ${slot.subGroupNames.join(', ')}` : ''
                ].filter(Boolean).join('\n');

                slotRow.appendChild(div);
              });
              frame.appendChild(slotRow);
            }

            td.appendChild(frame);
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        block.appendChild(table);
        gridsEl.appendChild(block);
      });

      // Safety net for rows that are physically too short for what a low-split
      // cell would normally show — e.g. brief Advisory periods. Row height is
      // driven purely by period duration (rowHeight()), not split count, so a
      // 1-2 split cell can still overflow even though density classes never
      // kick in for it. Fade content in the same priority order as the
      // density tiers (sub-groups → room → clamp teacher → clamp subject)
      // until it actually fits.
      gridsEl.querySelectorAll('.slot').forEach(slotEl => {
        const fits = () => slotEl.scrollHeight <= slotEl.clientHeight + 1;
        if (fits()) return;

        const subgroups = slotEl.querySelector('.slot-subgroups');
        if (subgroups) subgroups.style.display = 'none';
        if (fits()) return;

        const room = slotEl.querySelector('.slot-room');
        if (room) room.style.display = 'none';
        if (fits()) return;

        const teacher = slotEl.querySelector('.slot-teacher');
        if (teacher) teacher.style.setProperty('-webkit-line-clamp', '1');
        if (fits()) return;

        const subject = slotEl.querySelector('.slot-subject');
        if (subject) subject.style.setProperty('-webkit-line-clamp', '1');
      });

      // Full subject names are shown by default, but in narrow/heavily-split
      // cells even a 2-line (or 1-line, at higher density) clamp can still cut
      // a long name off mid-word. Detect that after layout (scrollHeight >
      // clientHeight means the clamp actually truncated something) and fall
      // back to the short code instead of showing a truncated full name.
      // Reads are batched before writes to avoid layout thrashing.
      const overflowing = [...gridsEl.querySelectorAll('.slot-subject')]
        .filter(el => el.scrollHeight > el.clientHeight + 1);
      overflowing.forEach(el => { el.textContent = el.dataset.short; });

      renderLegend(usedSubjects);
      applyFilter();
    }

    function renderLegend(usedSubjects) {
      const legend = document.getElementById('legend');
      const title  = document.getElementById('legend-title');
      const hint   = document.getElementById('legend-hint');
      const clear  = document.getElementById('legend-clear');
      legend.innerHTML = '';
      legend.appendChild(title);
      legend.appendChild(hint);
      legend.appendChild(clear);

      Object.entries(usedSubjects)
        .sort((a, b) => a[0].localeCompare(b[0]))
        .forEach(([short, name]) => {
          const item = document.createElement('div');
          item.className    = 'legend-item';
          item.dataset.subject = short;
          item.title        = `Click to highlight ${name}`;
          item.onclick      = () => toggleFilter(short);
          item.innerHTML = `
            <div class="legend-swatch" style="background:${subjectColour(short)}"></div>
            <div>
              <div class="legend-short">${short}</div>
              <div class="legend-name">${name}</div>
            </div>
          `;
          legend.appendChild(item);
        });
    }

    // ── Teacher timeline rendering ────────────────────────────────────────────
    /*
     * Scale: 1.6 px per minute. Chosen so a 45-min JS period is ~72px (readable)
     * and a 30-min non-teaching period is ~48px (not cramped).
     */
    const TL_PX_PER_MIN = 1.6;

    /**
     * Renders a timeline for any cross-school entity (teacher, subject, or
     * room) — they share the exact same schedule shape
     * (schedules[key] = {msss, js}), differing only in how a raw schedule
     * block should be shaped for display, which shapeBlock handles.
     *
     * @param {Object} entityData     e.g. teacherData/subjectData/roomData
     * @param {Object} currentEntity  e.g. currentTeacher/currentSubject/currentRoom
     * @param {(block: Object, source: 'ms'|'js') => Object} shapeBlock
     *   Maps a raw schedule block into the {subject, subjectShort, classNames,
     *   groupNames, roomShort, startMin, endMin, source} shape
     *   buildTimelineSection expects.
     */
    function renderEntityTimeline(entityData, currentEntity, shapeBlock) {
      if (!currentEntity || !entityData) return;

      const gridsEl = document.getElementById('grids');
      gridsEl.innerHTML = '';

      const sched = entityData.schedules[currentEntity.scheduleKey];
      if (!sched) return;

      const { msssPeriods, jsPeriods } = entityData;
      const allPeriods = [...msssPeriods, ...jsPeriods];
      const rangeStart = Math.min(...allPeriods.map(p => p.startMin));
      const rangeEnd   = Math.max(...allPeriods.map(p => p.endMin));
      const totalMin   = rangeEnd - rangeStart;
      const containerH = Math.round(totalMin * TL_PX_PER_MIN);

      const guideTimes = new Set();
      allPeriods.forEach(p => { guideTimes.add(p.startMin); guideTimes.add(p.endMin); });
      const guides = Array.from(guideTimes).map(min => ((min - rangeStart) / totalMin * 100));

      const hasMsss = !!sched.msss;
      const hasJs   = !!sched.js;
      /*
       * splitBySource: when the entity appears in both schools, each day column
       * is split left (JS) / right (MSSS), matching the period strips on either
       * side. Lessons at the same time will sit side-by-side, making scheduling
       * conflicts immediately visible.
       */
      const splitBySource = hasMsss && hasJs;

      const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

      if (hasMsss) {
        // Show one block per MSSS week, merging JS lessons into the same columns.
        ['A', 'B'].forEach(week => {
          const msssDay = sched.msss[currentSem]?.[week] || {};
          // JS lessons repeat every week, so the same Mon-Fri applies to both Week A and Week B.
          const jsDay   = hasJs ? (sched.js[currentSem]?.['single'] || {}) : {};

          const dayData = {};
          for (let d = 1; d <= 5; d++) {
            dayData[d] = groupIntoStacks([
              ...(msssDay[d] || []).map(l => shapeBlock(l, 'ms')),
              ...(jsDay[d]   || []).map(l => shapeBlock(l, 'js'))
            ]);
          }

          gridsEl.appendChild(buildTimelineSection(
            `Week ${week}`, dayData, dayLabels, splitBySource,
            rangeStart, totalMin, containerH, guides, jsPeriods, msssPeriods, week
          ));
        });
      } else {
        // JS-only (or, for rooms, JS-owned): a single week block, full-width blocks.
        const jsDay = sched.js[currentSem]?.['single'] || {};
        const dayData = {};
        for (let d = 1; d <= 5; d++) {
          dayData[d] = groupIntoStacks((jsDay[d] || []).map(l => shapeBlock(l, 'js')));
        }
        gridsEl.appendChild(buildTimelineSection(
          'Schedule', dayData, dayLabels, false,
          rangeStart, totalMin, containerH, guides, jsPeriods, msssPeriods, null
        ));
      }
    }

    /**
     * Groups same-time blocks (identical start, end, and school source) into
     * stacks. Subject/Room views regularly have many concurrent lessons at
     * one time slot — e.g. Advisory, taught by a different teacher per
     * homeroom but all at the same period — which would otherwise render as
     * fully overlapping absolutely-positioned blocks with only the last one
     * visible. A stack of 1 renders exactly like a normal block; 2+ renders
     * as a single clickable "N sessions" card (see buildTimelineSection)
     * that expands to a detail list on click, since there's no reasonable
     * fixed width to split an arbitrary, potentially large number of
     * concurrent sessions into side-by-side columns the way Classes view
     * does for a handful of simultaneous groups.
     *
     * @param {Array} blocks
     * @returns {Array<Array>} an array of stacks, each an array of 1+ blocks
     */
    function groupIntoStacks(blocks) {
      const byKey = {};
      const order = [];
      blocks.forEach(b => {
        const key = `${b.startMin}|${b.endMin}|${b.source}`;
        if (!byKey[key]) { byKey[key] = []; order.push(key); }
        byKey[key].push(b);
      });
      return order.map(key => byKey[key]);
    }

    function renderTeacherTimeline() {
      renderEntityTimeline(teacherData, currentTeacher, (l, source) => ({ ...l, source }));
    }

    function renderSubjectTimeline() {
      renderEntityTimeline(subjectData, currentSubject, (l, source) => ({
        ...l,
        source,
        // Subject is already fixed/known (that's what's selected), so the
        // "subject" header slot is repurposed to show who's teaching it —
        // more useful here than repeating the subject name on every block.
        subject:      l.teacherNames,
        subjectShort: currentSubject.short,
      }));
    }

    function renderRoomTimeline() {
      renderEntityTimeline(roomData, currentRoom, (l, source) => ({
        ...l,
        source,
        // The room is already fixed/known, so the "room" slot is repurposed
        // to show who's teaching there instead of repeating the room name.
        roomShort: l.teacherNames,
      }));
    }

    /**
     * Builds one combined timeline section (Week A or Week B).
     * When splitBySource is true each day column is divided left=JS / right=MSSS
     * so that overlapping blocks reveal scheduling conflicts without hiding either.
     */
    function buildTimelineSection(title, dayData, dayLabels, splitBySource,
        rangeStart, totalMin, containerH, guides, jsPeriods, msssPeriods, weekLetter) {

      const block = document.createElement('div');
      block.className = 'week-block';

      const titleEl = document.createElement('div');
      titleEl.className = 'week-title';
      titleEl.textContent = title;
      block.appendChild(titleEl);

      const body = document.createElement('div');
      body.className = 'timeline-body';

      body.appendChild(buildPeriodStrip(jsPeriods,   rangeStart, totalMin, containerH, 'left',  'JS'));

      const daysEl = document.createElement('div');
      daysEl.className = 'tl-days';

      const header = document.createElement('div');
      header.className = 'tl-days-header';
      dayLabels.forEach(label => {
        const th = document.createElement('div');
        th.className = 'th-day';
        th.textContent = label;
        header.appendChild(th);
      });
      daysEl.appendChild(header);

      const colsEl = document.createElement('div');
      colsEl.className = 'tl-cols';

      DAYS.forEach(d => {
        const stacks = dayData[d] || [];
        const col = document.createElement('div');
        col.className = 'tl-day-col';
        col.style.height = containerH + 'px';

        guides.forEach(pct => {
          const line = document.createElement('div');
          line.className = 'tl-guide';
          line.style.top = pct + '%';
          col.appendChild(line);
        });

        // Current-time red line — shown on today's column in the matching week.
        // weekLetter=null means a JS-only single-week section (always show on any weekday).
        const tlTodayCol = getTodayCol();
        const tlNowMin   = getCurrentMin();
        const tlWeekMatch = weekLetter === null
          ? true
          : currentWeek === weekLetter;
        if (tlTodayCol === d && tlWeekMatch && tlNowMin >= rangeStart && tlNowMin <= rangeStart + totalMin) {
          const nowLine = document.createElement('div');
          nowLine.className = 'tl-now-line';
          nowLine.style.top = ((tlNowMin - rangeStart) / totalMin * 100) + '%';
          col.appendChild(nowLine);
        }

        // Centre divider line — marks the MS/JS boundary when both are present.
        if (splitBySource) {
          const divider = document.createElement('div');
          divider.className = 'tl-centre-divider';
          col.appendChild(divider);
        }

        stacks.forEach(stack => {
          const lesson = stack[0];  // startMin/endMin/source are shared by the whole stack
          const el = document.createElement('div');
          el.className = 'tl-block';
          el.style.background = subjectColour(lesson.subjectShort);
          el.style.top    = ((lesson.startMin - rangeStart) / totalMin * 100) + '%';
          el.style.height = ((lesson.endMin - lesson.startMin) / totalMin * 100) + '%';

          // In split view, constrain each block to its school's half of the column.
          if (splitBySource) {
            if (lesson.source === 'js') {
              el.style.left  = '2px';
              el.style.right = 'calc(50% + 1px)';
            } else {
              el.style.left  = 'calc(50% + 1px)';
              el.style.right = '2px';
            }
          }

          const badgeHtml = splitBySource
            ? `<span class="tl-source tl-source-${lesson.source}">${lesson.source === 'js' ? 'JS' : 'MS'}</span>`
            : '';

          if (stack.length > 1) {
            // Many concurrent sessions (e.g. Advisory) — see groupIntoStacks().
            el.classList.add('tl-block-stacked');
            el.innerHTML = `
              <div class="tl-block-header">
                <div class="tl-block-subject">${stack.length} sessions</div>
                ${badgeHtml}
              </div>
              <div class="tl-block-class">Click to view all</div>
              <div class="tl-block-time">${formatTime(lesson.startMin)}–${formatTime(lesson.endMin)}</div>
            `;
            el.title = `${stack.length} concurrent sessions — click to view`;
            el.addEventListener('click', () => showLessonStack(stack));
          } else {
            const groupsHtml = lesson.groupNames.length
              ? `<div class="tl-block-groups">${lesson.groupNames.join(', ')}</div>` : '';

            el.innerHTML = `
              <div class="tl-block-header">
                <div class="tl-block-subject">${lesson.subject}</div>
                ${badgeHtml}
              </div>
              <div class="tl-block-class">${lesson.classNames}</div>
              ${groupsHtml}
              <div class="tl-block-room">${lesson.roomShort}</div>
              <div class="tl-block-time">${formatTime(lesson.startMin)}–${formatTime(lesson.endMin)}</div>
            `;
            el.title = [
              `[${lesson.source === 'js' ? 'JS' : 'MS'}] ${lesson.subject}`,
              lesson.classNames,
              lesson.groupNames.join(', '),
              lesson.roomShort
            ].filter(Boolean).join('\n');
          }

          col.appendChild(el);
        });

        colsEl.appendChild(col);
      });

      daysEl.appendChild(colsEl);
      body.appendChild(daysEl);
      body.appendChild(buildPeriodStrip(msssPeriods, rangeStart, totalMin, containerH, 'right', 'MS / SS'));
      block.appendChild(body);
      return block;
    }

    /**
     * Opens the lesson-stack modal listing every concurrent session in a
     * stacked timeline card (see groupIntoStacks()). Each block's fields
     * already carry whatever's meaningful for the current view — e.g. in
     * Subject view "subject" was repurposed to hold the teacher's name
     * (see renderSubjectTimeline) — so this just displays what's there
     * rather than assuming any particular view.
     */
    function showLessonStack(stack) {
      const first = stack[0];
      document.getElementById('lesson-stack-title').textContent =
        `${formatTime(first.startMin)}–${formatTime(first.endMin)} · ${stack.length} concurrent sessions`;

      document.getElementById('lesson-stack-body').innerHTML = stack
        .map(b => {
          const groupsSuffix = b.groupNames && b.groupNames.length ? ` · ${b.groupNames.join(', ')}` : '';
          return `
            <div class="lesson-stack-item">
              <div class="lesson-stack-item-header">${b.subject}</div>
              <div class="lesson-stack-item-detail">${b.classNames}${groupsSuffix}</div>
              <div class="lesson-stack-item-detail">${b.roomShort}</div>
            </div>
          `;
        })
        .join('');

      document.getElementById('lesson-stack-modal').classList.add('open');
    }

    function closeLessonStack() {
      document.getElementById('lesson-stack-modal').classList.remove('open');
    }

    /**
     * Builds a period-reference strip (left = JS, right = MS/SS).
     * Each period is a sized card positioned by real clock time, making it easy
     * to read across any horizontal band and compare periods between schools.
     */
    function buildPeriodStrip(periods, rangeStart, totalMin, containerH, side, label) {
      const strip = document.createElement('div');
      strip.className = `tl-period-strip ${side}`;

      const header = document.createElement('div');
      header.className = 'tl-strip-header';
      header.textContent = label;
      strip.appendChild(header);

      const body = document.createElement('div');
      body.className = 'tl-strip-body';
      body.style.height = containerH + 'px';

      periods.forEach(period => {
        const card = document.createElement('div');
        const nonTeaching = isNonTeaching(period.label);
        card.className = 'tl-period-card ' + (nonTeaching ? 'non-teaching' : 'teaching');
        card.style.top    = ((period.startMin - rangeStart) / totalMin * 100) + '%';
        card.style.height = ((period.endMin   - period.startMin) / totalMin * 100) + '%';
        card.innerHTML = `
          <span class="tl-pc-name">${period.short || period.label}</span>
          <span class="tl-pc-time">${formatTime(period.startMin)}–${formatTime(period.endMin)}</span>
        `;
        body.appendChild(card);
      });

      strip.appendChild(body);
      return strip;
    }

    // ── Meeting finder ────────────────────────────────────────────────────────

    /**
     * Populates the meeting-finder search list with the full teacher roster.
     * Called once from onTeacherDataLoaded() so the meeting-finder search is
     * ready whenever the user switches to that view.
     */
    function wireMeetingSearch(teachers) {
      const input = document.getElementById('meeting-input');
      const list  = document.getElementById('meeting-list');
      list.innerHTML = '';

      teachers.forEach(t => {
        const li = document.createElement('li');
        li.dataset.key = t.scheduleKey;
        li.textContent = t.name;
        li.addEventListener('mousedown', () => {
          addMeetingPerson(t);
          input.value = '';
          applyMeetingFilter();
          // Keep dropdown closed after a mouse-click pick; keydown flow keeps it open.
          list.classList.remove('open');
        });
        list.appendChild(li);
      });

      // Selects the person identified by scheduleKey via keyboard, then leaves
      // the input focused and the dropdown open so the next name can be typed
      // immediately without any extra click.
      function selectByKey(key) {
        const teacher = teachers.find(t => t.scheduleKey === key);
        if (!teacher) return;
        addMeetingPerson(teacher);
        input.value = '';
        list.querySelectorAll('li.active').forEach(li => li.classList.remove('active'));
        applyMeetingFilter();
        list.classList.add('open');   // stay open for the next person
      }

      input.addEventListener('keydown', e => {
        const visible = [...list.querySelectorAll('li:not(.hidden)')];
        const current = list.querySelector('li.active');
        const idx     = current ? visible.indexOf(current) : -1;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          visible.forEach(li => li.classList.remove('active'));
          const next = visible[idx < visible.length - 1 ? idx + 1 : 0];
          if (next) { next.classList.add('active'); next.scrollIntoView({ block: 'nearest' }); }
          list.classList.add('open');

        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          visible.forEach(li => li.classList.remove('active'));
          const prev = visible[idx > 0 ? idx - 1 : visible.length - 1];
          if (prev) { prev.classList.add('active'); prev.scrollIntoView({ block: 'nearest' }); }
          list.classList.add('open');

        } else if (e.key === 'Enter') {
          e.preventDefault();
          // Use the highlighted item, or auto-select when exactly one remains.
          const target = current || (visible.length === 1 ? visible[0] : null);
          if (target) selectByKey(target.dataset.key);

        } else if (e.key === 'Escape') {
          visible.forEach(li => li.classList.remove('active'));
          list.classList.remove('open');
        }
      });

      input.addEventListener('focus', () => {
        applyMeetingFilter();
        list.classList.add('open');
        input.select();
      });
      input.addEventListener('blur', () => {
        list.querySelectorAll('li.active').forEach(li => li.classList.remove('active'));
        list.classList.remove('open');
      });
      input.addEventListener('input', () => {
        // Clear keyboard highlight whenever the user types — position is stale.
        list.querySelectorAll('li.active').forEach(li => li.classList.remove('active'));
        applyMeetingFilter();
        list.classList.add('open');
      });
    }

    /** Filters the meeting-search dropdown by the typed text, hiding already-selected people. */
    function applyMeetingFilter() {
      const input = document.getElementById('meeting-input');
      const list  = document.getElementById('meeting-list');
      if (!list) return;
      const selectedKeys = new Set(meetingPeople.map(p => p.scheduleKey));
      const q = input.value.trim().toLowerCase();
      list.querySelectorAll('li').forEach(li => {
        const matchesText = q.length === 0 || li.textContent.toLowerCase().includes(q);
        const alreadySelected = selectedKeys.has(li.dataset.key);
        li.classList.toggle('hidden', !matchesText || alreadySelected);
      });
    }

    /** Adds a teacher to the meeting-finder selection and re-renders. */
    function addMeetingPerson(teacher) {
      if (meetingPeople.some(p => p.scheduleKey === teacher.scheduleKey)) return;
      meetingPeople.push(teacher);
      if (currentView === 'meeting') renderMeetingFinder();
    }

    /** Removes a teacher from the meeting-finder selection and re-renders. */
    function removeMeetingPerson(scheduleKey) {
      meetingPeople = meetingPeople.filter(p => p.scheduleKey !== scheduleKey);
      applyMeetingFilter();
      renderMeetingFinder();
    }

    /** Switches between stacked and heatmap display modes and re-renders. */
    function setMeetingMode(mode) {
      meetingMode = mode;
      document.getElementById('btn-meeting-stacked').classList.toggle('active', mode === 'stacked');
      document.getElementById('btn-meeting-heatmap').classList.toggle('active', mode === 'heatmap');
      renderMeetingFinder();
    }

    /**
     * Returns true if the given teacher has a lesson that overlaps this period
     * on the specified day, week, and semester. Checks both MSSS and JS schedules
     * because some staff teach across both schools.
     */
    function personIsBusy(person, period, day, week, sem) {
      const sched = teacherData && teacherData.schedules[person.scheduleKey];
      if (!sched) return false;
      // week==='single' means a JS-only grid; skip the MSSS schedule entirely.
      const msssBlocks = (week !== 'single' && sched.msss && sched.msss[sem] && sched.msss[sem][week])
        ? (sched.msss[sem][week][day] || []) : [];
      const jsBlocks   = (sched.js && sched.js[sem] && sched.js[sem]['single'])
        ? (sched.js[sem]['single'][day] || []) : [];
      return [...msssBlocks, ...jsBlocks].some(
        b => b.startMin < period.endMin && b.endMin > period.startMin
      );
    }

    /**
     * Renders the meeting-finder grid into #grids.
     * When all selected people are JS-only (no MSSS schedule), shows one
     * "Schedule" grid using JS period times. Otherwise shows Week A and Week B
     * using MSSS periods, since MSSS teachers have different lessons each week.
     * Each cell shows coloured availability strips (stacked) or a heat-coded
     * fraction count (heatmap). Cells where everyone is free get a green outline.
     */
    function renderMeetingFinder() {
      const gridsEl = document.getElementById('grids');
      gridsEl.innerHTML = '';

      if (!teacherData) {
        gridsEl.innerHTML = '<p class="mf-placeholder">Loading teacher data…</p>';
        return;
      }

      if (meetingPeople.length === 0) {
        gridsEl.innerHTML = '<p class="mf-placeholder">Use the People search above to add staff — their combined availability will appear here.</p>';
        return;
      }

      const sem     = currentSem;
      const days    = [1, 2, 3, 4, 5];
      const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

      // If everyone is JS-only, use JS period times and a single grid.
      const jsOnly = meetingPeople.every(p => {
        const sched = teacherData.schedules[p.scheduleKey];
        return sched && !sched.msss;
      });
      const periods = (jsOnly
        ? (teacherData.jsPeriods || [])
        : (teacherData.msssPeriods || [])
      ).filter(p => !isNonTeaching(p.label));
      const weeks = jsOnly ? ['single'] : ['A', 'B'];

      // ── Find best times (everyone free) ────────────────────────────────────
      const bestSlots = new Set();
      weeks.forEach(week => {
        days.forEach(day => {
          periods.forEach(period => {
            const allFree = meetingPeople.every(p => !personIsBusy(p, period, day, week, sem));
            if (allFree) bestSlots.add(`${week}-${day}-${period.period}`);
          });
        });
      });

      // ── Best-times banner ──────────────────────────────────────────────────
      const bannerEl = document.createElement('div');
      bannerEl.className = 'mf-best-times';
      if (bestSlots.size === 0) {
        bannerEl.classList.add('mf-no-times');
        bannerEl.innerHTML = '<strong>No common free times</strong> — at least one person is busy in every teaching period.';
      } else {
        const chips = [];
        weeks.forEach(week => {
          days.forEach((day, di) => {
            periods.forEach(period => {
              if (bestSlots.has(`${week}-${day}-${period.period}`)) {
                chips.push(`<span class="mf-best-chip">Wk ${week} · ${dayLabels[di]} · ${period.label}</span>`);
              }
            });
          });
        });
        const shown = chips.slice(0, 10).join('');
        const extra = chips.length > 10 ? `<span class="mf-more">+${chips.length - 10} more</span>` : '';
        bannerEl.innerHTML = `<strong>Everyone free:</strong> ${shown}${extra}`;
      }
      gridsEl.appendChild(bannerEl);

      // ── People chips ───────────────────────────────────────────────────────
      const chipsEl = document.createElement('div');
      chipsEl.className = 'mf-chips';
      meetingPeople.forEach((person, i) => {
        const colour = PERSON_COLOURS[i % PERSON_COLOURS.length];
        const chip = document.createElement('span');
        chip.className = 'mf-chip';
        chip.style.background = colour;
        const removeKey = person.scheduleKey.replace(/'/g, "\\'");
        chip.innerHTML =
          `${person.name} <button onclick="removeMeetingPerson('${removeKey}')" title="Remove">✕</button>`;
        chipsEl.appendChild(chip);
      });
      gridsEl.appendChild(chipsEl);

      // ── One grid per week ──────────────────────────────────────────────────
      const mfTodayCol = getTodayCol();
      const mfNowMin   = getCurrentMin();

      weeks.forEach(week => {
        const section = document.createElement('div');
        section.className = 'mf-grid-section';

        const heading = document.createElement('div');
        heading.className = 'mf-week-label';
        heading.textContent = week === 'single' ? 'Schedule' : `Week ${week}`;
        section.appendChild(heading);

        // Whether to show the now-indicator on this particular grid.
        const showNowMf = mfTodayCol !== null &&
          (week === 'single' || week === currentWeek);

        const table = document.createElement('table');
        table.className = 'mf-grid';

        // Column widths
        const colgroup = document.createElement('colgroup');
        const colPeriod = document.createElement('col');
        colPeriod.className = 'mf-col-period';
        colgroup.appendChild(colPeriod);
        days.forEach(() => {
          const col = document.createElement('col');
          colgroup.appendChild(col);
        });
        table.appendChild(colgroup);

        // Header row
        const thead = table.createTHead();
        const headerRow = thead.insertRow();
        const thPeriod = document.createElement('th');
        headerRow.appendChild(thPeriod);
        dayLabels.forEach((label, di) => {
          const th = document.createElement('th');
          th.textContent = label;
          if (showNowMf && days[di] === mfTodayCol) th.classList.add('current-day');
          headerRow.appendChild(th);
        });

        // Data rows — one per teaching period
        const tbody = table.createTBody();
        periods.forEach(period => {
          const tr = tbody.insertRow();
          const periodIsNow = showNowMf &&
            mfNowMin >= period.startMin && mfNowMin < period.endMin;
          if (periodIsNow) tr.classList.add('current-period');

          // Period label cell
          const tdLabel = tr.insertCell();
          tdLabel.className = 'mf-period-label';
          tdLabel.innerHTML =
            `<span class="mf-period-name">${period.label}</span>` +
            `<span class="mf-period-time">${formatTime(period.startMin)}</span>`;

          // Day cells
          days.forEach((day, di) => {
            const td = tr.insertCell();
            const isBest = bestSlots.has(`${week}-${day}-${period.period}`);
            const isNowCell = periodIsNow && showNowMf && day === mfTodayCol;

            if (meetingMode === 'stacked') {
              td.className = 'mf-cell-stacked' +
                (isBest ? ' mf-best-slot' : '') +
                (isNowCell ? ' current-day-now' : '');
              const inner = document.createElement('div');
              inner.className = 'mf-stacked-inner';
              meetingPeople.forEach((person, pi) => {
                const busy = personIsBusy(person, period, day, week, sem);
                const strip = document.createElement('div');
                strip.className = 'mf-strip ' + (busy ? 'mf-strip-busy' : 'mf-strip-free');
                if (busy) strip.style.background = PERSON_COLOURS[pi % PERSON_COLOURS.length];
                strip.title = person.name + (busy ? ': teaching' : ': free');
                inner.appendChild(strip);
              });
              td.appendChild(inner);

            } else {
              const freeCount = meetingPeople.filter(p => !personIsBusy(p, period, day, week, sem)).length;
              const fraction  = freeCount / meetingPeople.length;
              let heatClass;
              if (fraction === 1)        heatClass = 'heat-all';
              else if (fraction >= 0.75) heatClass = 'heat-most';
              else if (fraction >= 0.5)  heatClass = 'heat-mix';
              else if (fraction > 0)     heatClass = 'heat-few';
              else                       heatClass = 'heat-none';
              td.className = `mf-cell-heat ${heatClass}` +
                (isBest ? ' mf-best-slot' : '') +
                (isNowCell ? ' current-day-now' : '');
              td.textContent = `${freeCount}/${meetingPeople.length}`;
            }
          });
        });

        table.appendChild(tbody);
        section.appendChild(table);
        gridsEl.appendChild(section);
      });

      // ── Legend ─────────────────────────────────────────────────────────────
      const legendEl = document.createElement('div');
      legendEl.className = 'mf-legend';
      if (meetingMode === 'heatmap') {
        [
          ['heat-all',  'All free'],
          ['heat-most', 'Most free'],
          ['heat-mix',  'Half free'],
          ['heat-few',  'Few free'],
          ['heat-none', 'None free'],
        ].forEach(([cls, label]) => {
          const span = document.createElement('span');
          span.className = `mf-leg ${cls}`;
          span.textContent = label;
          legendEl.appendChild(span);
        });
      } else {
        legendEl.innerHTML =
          `<span class="mf-leg-stacked"><span class="mf-leg-strip mf-strip-free"></span> Free</span>` +
          `<span class="mf-leg-stacked"><span class="mf-leg-strip" style="background:#1565c0"></span> Teaching</span>`;
      }
      gridsEl.appendChild(legendEl);
    }

    // Refresh the current-time indicators every 5 minutes. All data is already
    // in memory so re-renders are instant; this keeps the "now" line accurate
    // as the school day progresses without requiring a full page reload.
    setInterval(() => {
      if (!timetableData && !teacherData) return;
      if      (currentView === 'teachers') renderTeacherTimeline();
      else if (currentView === 'subjects') renderSubjectTimeline();
      else if (currentView === 'rooms')    renderRoomTimeline();
      else if (currentView === 'meeting')  renderMeetingFinder();
      else if (currentView === 'who')      renderWhoIsTeaching();
      else                                 renderGrid();
    }, 5 * 60 * 1000);

    init();
  </script>
</body>
</html>
